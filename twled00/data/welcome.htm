		<style>
			:root{color-scheme:dark}
			body{box-sizing:border-box;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:16px;font-family:"Segoe UI",Roboto,"Helvetica Neue",Helvetica,Arial,sans-serif;line-height:1.5;text-align:center;color:#e8eefa;background:radial-gradient(70vw 60vh at 12% -10%,rgba(34,211,238,.1),transparent 70%) fixed,radial-gradient(70vw 60vh at 100% 110%,rgba(139,92,246,.13),transparent 70%) fixed,#060b18}
			.card{box-sizing:border-box;width:100%;max-width:520px;padding:24px 20px;background:#101a2e;border:1px solid rgba(148,178,230,.22);border-radius:14px}
			h1{margin:0 0 4px;font-size:1.6rem;font-weight:600;letter-spacing:.05em;color:#22d3ee}
			p{margin:0 0 8px}
			.btn{display:block;margin:8px 0 16px;padding:10px 16px;font-size:17px;text-decoration:none;color:#e8eefa;background:#1a2740;border:1px solid rgba(148,178,230,.22);border-radius:12px;transition:border-color .2s,box-shadow .2s}
			.btn:hover,.btn:focus{border-color:#22d3ee;box-shadow:0 0 12px rgba(34,211,238,.35);outline:0}
			.pri{background:rgba(34,211,238,.13);border-color:#22d3ee}
			img{display:block;width:313px;max-width:100%;height:auto;margin:0 auto 20px}
			h2{margin:0 0 4px;font-size:1rem;font-weight:400}
			h3{margin:0 0 20px;font-size:1rem;font-weight:400;opacity:.8}
			b{display:block;margin-bottom:8px;padding-top:16px;border-top:1px solid rgba(148,178,230,.22)}
			.btn:last-child{margin-bottom:0}
		</style>
