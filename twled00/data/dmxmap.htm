<!DOCTYPE html>
<html><head><meta content='width=device-width' name='viewport'>
<title>DMX Map</title>
<script>function B(){window.history.back()};function RS(){window.location = "/settings";}function RP(){top.location.href="/";}function FM() {
  var dmxlabels = ["SET 0","RED","GREEN","BLUE","WHITE","SHUTTER","SET 255", "DISABLED"];
  var dmxchans = [];
  for (i=0;i<512;i++) {
    dmxchans.push(7); // set all to DISABLED
  }
  for (i=0;i<LC;i++) {
    FS = CS + (CG * i);
    for (j=0;j<CN;j++) {
      DA=FS+j;
      dmxchans[DA-1] = CH[j];
    }
  }
  DMXMap = "";
  for (i=0;i<512;i++) {
    DMXMap += "<div class=\"anytype type" + dmxchans[i] + "\">" + String(i+1) + "<br />" + dmxlabels[dmxchans[i]] + "</div>";
  }
  document.getElementById("map").innerHTML = DMXMap;
}</script>
<style>@import url("style.css");.anytype{box-sizing:border-box;background:var(--pn);border:1px solid var(--bd);border-radius:10px;margin:2px;float:left;width:100px;height:100px;line-height:1.5;padding-top:24px}.type7{color:#8493b3;border-style:dotted}.type6{color:var(--tx)}.type5{color:var(--acc)}.type4{color:var(--tx);font-weight:600}.type3{color:#60a5fa;font-weight:600}.type2{color:#34d399;font-weight:600}.type1{color:#ff5470;font-weight:600}</style></head>
<body onload="FM();"><div id="map">...</div></body></html>
