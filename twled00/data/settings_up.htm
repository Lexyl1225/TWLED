<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
	<title>Upcoming</title>
	<script src="common.js" type="text/javascript"></script>
	<script>
		function S() {
			getLoc();
		}
		function tglOP() {
			toggle("op");
			gId("opb").setAttribute("aria-expanded", !gId("op").classList.contains("hide"));
		}
	</script>
	<style>
		@import url("style.css");
		html, body {
			min-height: 100%;
		}
		.overlay {
			box-sizing: border-box;
			min-height: 100vh;
			padding: 24px 20px;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			position: relative;
			z-index: 2;
		}
		h1 {
			font-size: clamp(32px, 7vw, 48px);
			line-height: 1.2;
			margin: 0 0 8px;
		}
		.xmas {
			color: var(--acc);
			font-size: clamp(20px, 4vw, 28px);
			font-weight: 600;
			letter-spacing: .05em;
			line-height: 1.3;
		}
		p {
			line-height: 1.5;
			margin: 12px 0 16px;
		}
		.menu {
			width: 100%;
			max-width: 520px;
		}
		.menu button, .menu .btn {
			box-sizing: border-box;
			display: block;
			width: 100%;
			margin: 10px 0 0;
			padding: 10px 16px;
			line-height: 1.5;
			text-align: center;
			color: var(--tx);
		}
		#opb::after {
			content: "\25BE";
			display: inline-block;
			margin-left: 8px;
			transition: transform .2s;
		}
		#opb[aria-expanded="true"]::after {
			transform: rotate(180deg);
		}
		#opb[aria-expanded="true"] {
			border-color: var(--acc);
			color: var(--acc);
		}
		#op {
			border-left: 2px solid var(--bd);
			margin-top: 10px;
			padding-left: 12px;
		}
		#op .btn:first-child {
			margin-top: 0;
		}
		.menu .back {
			background: var(--as);
			border-color: var(--acc);
		}
		.snowflake {
			position: fixed;
			top: -24px;
			color: var(--tx);
			pointer-events: none;
			animation: fall linear infinite;
			z-index: 1;
		}
		@keyframes fall {
			to { transform: translateY(calc(100vh + 24px)); }
		}
	</style>
</head>
<body onload="S()">
	<div id="snow-container"></div>

	<div class="overlay">
		<h1>Upcoming</h1>
		<div class="xmas">🎄 Merry Christmas 🎄</div>
		<p>Stay tuned for exciting events and updates from Tom's World!</p>

		<div class="menu">
			<button type="button" id="opb" aria-expanded="false" aria-controls="op" onclick="tglOP()">Other projects</button>
			<div id="op" class="hide">
				<a class="btn" href="https://project-tracker.ratfish-regulus.ts.net" target="_blank" rel="noopener noreferrer">Project Tracker</a>
				<a class="btn" href="https://electrical-bulletin-board.ratfish-regulus.ts.net" target="_blank" rel="noopener noreferrer">Bulletin Board</a>
				<a class="btn" href="https://www.epmsystem.online" target="_blank" rel="noopener noreferrer">Preventive Maintenance</a>
				<a class="btn" href="https://serverx.ratfish-regulus.ts.net" target="_blank" rel="noopener noreferrer">Accomplishment Report</a>
			</div>
			<button type="button" class="back" onclick="B()">Back</button>
		</div>
	</div>

	<script>
		// Generate snowflakes dynamically
		const snowContainer = gId('snow-container');
		for (let i = 0; i < 50; i++) {
			const snowflake = cE('div');
			snowflake.classList.add('snowflake');
			snowflake.textContent = '❄';
			snowflake.style.left = Math.random() * 100 + 'vw';
			snowflake.style.animationDuration = (Math.random() * 3 + 2) + 's';
			snowflake.style.fontSize = (Math.random() * 10 + 10) + 'px';
			snowflake.style.opacity = Math.random() * .5;
			snowContainer.appendChild(snowflake);
		}
	</script>
</body>
</html>
